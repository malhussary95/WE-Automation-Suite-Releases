<style>

:#fff}.jobs{margin-top:14px}.table{width:100%;border-collapse:collapse;font-size:10px}.table th{color:#688099;text-align:left;padding:9px;border-bottom:1px solid #203b56}.table td{padding:10px;border-bottom:1px solid #172e45}.ok{color:#25dc92}.warn{color:#ffc247}.bad{color:#ff6571}.status{display:inline-block;padding:4px 8px;border-radius:12px;background:#0b3226;color:#2be49a}.system{display:grid;gap:10px}.sysrow{display:flex;justify-content:space-between;color:#aabacc}.sysrow span:last-child{color:#2be49a}.toolgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.tool{border:1px solid #23435e;background:#0d2237;border-radius:9px;padding:13px;cursor:pointer}.tool:hover{border-color:#168ff5}.tool h4{margin:0 0 5px}.tool p{color:#748ba2;font-size:10px;margin:0}.hidden{display:none!important}.toast{position:fixed;right:22px;bottom:22px;background:#10263c;border:1px solid #2a4d6c;border-radius:8px;padding:12px 16px;z-index:50;box-shadow:0 10px 30px #0008}.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;z-index:100}.modalbox{width:min(900px,92vw);background:#0b1b2d;border:1px solid #28506e;border-radius:12px;padding:18px}.logs{height:330px;overflow:auto;background:#050d16;border-radius:8px;padding:12px;color:#9fb2c5;font:12px Consolas,monospace;white-space:pre-wrap}.toolview{margin-top:14px}.back{color:#6cb8ff;cursor:pointer}.sectiontitle{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}

<aside class="side"><div class="brand"><div class="logo">WE</div><div><b>Automation Suite</b><small>Enterprise v4.0</small></div></div>
